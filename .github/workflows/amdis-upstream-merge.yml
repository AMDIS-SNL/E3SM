name: amdis-upstream-merge

# Weekly merge of E3SM-Project/E3SM master into this repo's master.
# On success, a PR is opened from 'upstream-merge-<DATE>'; on failure
# (e.g., merge conflicts), an issue is opened instead.
#
# Note: pushes/PRs made with the default GITHUB_TOKEN do not trigger other
# workflows (e.g., amdis-ci), and GITHUB_TOKEN cannot push commits that modify
# files under .github/workflows. If either matters, define a repo secret named
# UPSTREAM_MERGE_TOKEN (a PAT with 'contents', 'pull-requests', 'issues' and
# 'workflows' write access), which is used in place of GITHUB_TOKEN if present.

on:
  # Sunday mornings
  schedule:
    - cron: '0 9 * * 0'  # 9 AM UTC, i.e., 3 AM MT during Standard Time

  # Manual run, e.g., to grab urgent fixes
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: E3SM-Project/E3SM
  UPSTREAM_BRANCH: master
  BASE_BRANCH: master
  ASSIGNEE: bartgol
  GH_TOKEN: ${{ secrets.UPSTREAM_MERGE_TOKEN || github.token }}

jobs:
  upstream-merge:
    # Do not run on forks of this repo
    if: github.repository == 'AMDIS-SNL/E3SM'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Set up merge branch
        id: setup
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="upstream-merge-${DATE}"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            echo "::error::Branch ${BRANCH} already exists on origin. Delete it (and close any related PR) to re-run."
            exit 1
          fi

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          # Nothing to do if we already contain upstream's master
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

          git checkout -b "${BRANCH}"

      - name: Merge upstream
        id: merge
        if: steps.setup.outputs.uptodate == 'false'
        run: |
          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          git merge --no-ff "upstream/${UPSTREAM_BRANCH}" \
            -m "Merge ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} (${UPSTREAM_SHA:0:10}) into ${BASE_BRANCH}"

      - name: Push branch and open PR
        if: steps.merge.outcome == 'success'
        env:
          BRANCH: ${{ steps.setup.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          git push origin "${BRANCH}"
          NCOMMITS=$(git rev-list --count "origin/${BASE_BRANCH}..${UPSTREAM_SHA}")
          cat > pr-body.md <<BODY
          Automated merge of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` (\`${UPSTREAM_SHA}\`) into \`${BASE_BRANCH}\`, bringing in ${NCOMMITS} upstream commit(s).

          Generated by the [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow.

          Please do **not** squash this PR; use a merge commit, to preserve upstream history.
          BODY
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}" \
            --title "Upstream merge ${{ steps.setup.outputs.date }}" \
            --body-file pr-body.md \
            --assignee "${ASSIGNEE}"

      - name: Open issue on failure
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          {
            echo "The automated merge of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` into \`${BASE_BRANCH}\` failed (most likely due to merge conflicts)."
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Conflicting files:"
            echo '```'
            git diff --name-only --diff-filter=U
            echo '```'
            echo
            echo "To merge manually:"
            echo '```'
            echo "git fetch upstream ${UPSTREAM_BRANCH}"
            echo "git checkout -b ${{ steps.setup.outputs.branch }} origin/${BASE_BRANCH}"
            echo "git merge upstream/${UPSTREAM_BRANCH}"
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Upstream merge ${{ steps.setup.outputs.date }} failed" \
            --body-file issue-body.md \
            --assignee "${ASSIGNEE}"

      - name: Open issue on other failures
        if: failure() && steps.merge.outcome != 'failure'
        run: |
          gh issue create \
            --title "Upstream merge ${{ steps.setup.outputs.date || 'run' }} failed" \
            --body "The ${GITHUB_WORKFLOW} workflow failed before or after the merge step. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --assignee "${ASSIGNEE}"
