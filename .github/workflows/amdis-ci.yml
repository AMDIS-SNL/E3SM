name: amdis-ci

on:
  # Runs on PRs
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

  # Manual run is used to bless
  workflow_dispatch:

  # Runs when a PR is added to a merge queue
  merge_group:

  # Also run nightly
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested (or the merge group sha)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenMPI refuses to run as root otherwise (see 'options: --user root' in the jobs)
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

defaults:
  run:
    # Login shell, so that the image's modules get loaded (and XYZ_ROOT vars set)
    shell: bash -l {0}

jobs:
  changes:
    # PRs only run the tests if relevant files changed. The filtering is done
    # here (rather than with 'paths:' in the trigger) so that the amdis-ci-gate
    # job always reports a status and can be used as a required check.
    runs-on: [ubuntu-24.04]
    name: changes
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - '.github/workflows/amdis-ci.yml'
              - '.github/actions/build-trilinos/**'
              - '.github/actions/homme-configure/**'
              - '.github/actions/homme-submodules/**'
              - 'components/homme/**'
      - name: Decide whether to run the tests
        id: decide
        run: |
          # Nightly and manual runs always test
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            run=true
          else
            run=${{ steps.filter.outputs.relevant }}
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "Run tests: ${run}"

  # Plain hommexx: make sure the FAD-related features did not break the usual build
  hommexx:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [ubuntu-24.04]
    name: hommexx
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      # The image's default user cannot write to the runner's workspace/temp dirs
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
      - name: hommexx-configure
        uses: ./e3sm/source/.github/actions/homme-configure
        with:
          build-type: DEBUG
          pio: false
      - name: hommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 VERBOSE=ON
      - name: hommexx-test
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          ctest --output-on-failure -L unit
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-hommexx
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/Testing/Temporary/Last*
            e3sm/build/**/flags.make
          retention-days: 14

  # Forward sensitivities and FAD types (needs Trilinos/Sacado) and the AMDIS tests
  fad:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [ubuntu-24.04]
    name: fad
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: Build Trilinos
        uses: ./e3sm/source/.github/actions/build-trilinos
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
      - name: hommexx-configure
        uses: ./e3sm/source/.github/actions/homme-configure
        with:
          fad: true
      - name: hommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 VERBOSE=ON
      - name: hommexx-test
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          ctest --output-on-failure -L 'AMDIS|unit'
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-fad
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/Testing/Temporary/Last*
            e3sm/build/**/flags.make
          retention-days: 14

  # Python bindings (so far, we only check that they build)
  pyhommexx:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: [ubuntu-24.04]
    name: pyhommexx
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: Build Trilinos
        uses: ./e3sm/source/.github/actions/build-trilinos
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
      - name: install python packages
        run: |
          # Installs into the image's venv; no-op for packages already there
          python3 -m pip install numpy xarray netCDF4 mpi4py nanobind
      - name: hommexx-configure
        uses: ./e3sm/source/.github/actions/homme-configure
        with:
          fad: true
          pyhommexx: true
      - name: pyhommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 pyhommexx VERBOSE=ON
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-pyhommexx
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/**/flags.make
          retention-days: 14

  amdis-ci-gate:
    # Single status to use as a required check (for PRs). It is green if all
    # the tests passed or if they were not needed.
    # NOTE: keep always(). Without it, the job is skipped if a needed job fails,
    # and a skipped required check counts as passing.
    needs: [changes, hommexx, fad, pyhommexx]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: [ubuntu-24.04]
    name: amdis-ci-gate
    steps:
      - name: Report the result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run }}
          TESTS_RESULTS: ${{ needs.hommexx.result }} ${{ needs.fad.result }} ${{ needs.pyhommexx.result }}
        run: |
          echo "changes: ${CHANGES_RESULT}, run tests: ${RUN_TESTS}"
          echo "tests (hommexx fad pyhommexx): ${TESTS_RESULTS}"
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Could not determine whether tests are needed"; exit 1
          elif [[ "${RUN_TESTS}" != "true" ]]; then
            echo "No relevant changes, tests skipped"
          else
            for r in ${TESTS_RESULTS}; do
              if [[ "${r}" != "success" ]]; then
                echo "Some tests did not pass"; exit 1
              fi
            done
          fi
