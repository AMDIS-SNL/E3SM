name: amdis-ci

on:
  # Runs on PRs
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '.github/workflows/amdis-ci.yml'
      - '.github/actions/build-trilinos/**'
      - '.github/actions/homme-submodules/**'
      - 'components/homme/**'

  # Manual run is used to bless
  workflow_dispatch:

  # Also run nightly
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenMPI refuses to run as root otherwise (see 'options: --user root' in the jobs)
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

defaults:
  run:
    # Login shell, so that the image's modules get loaded (and XYZ_ROOT vars set)
    shell: bash -l {0}

jobs:
  # Plain hommexx: make sure the FAD-related features did not break the usual build
  hommexx:
    runs-on: [ubuntu-24.04]
    name: hommexx
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      # The image's default user cannot write to the runner's workspace/temp dirs
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
      - name: hommexx-configure
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm
          mkdir build && cd build
          cmake \
           -D CMAKE_CXX_COMPILER:STRING=mpicxx        \
           -D CMAKE_C_COMPILER:STIRNG=mpicc           \
           -D CMAKE_Fortran_COMPILER:STRING=mpifort   \
           -D CMAKE_BUILD_TYPE:STRING=DEBUG           \
           \
           -D BUILD_HOMME_TOOL:BOOL=OFF               \
           -D BUILD_HOMME_WITHOUT_PIOLIBRARY:BOOL=ON  \
           -D HOMME_FIND_BLASLAPACK:BOOL=ON           \
           -D HOMMEXX_BFB_TESTING:BOOL=ON             \
           \
           -S ${GITHUB_WORKSPACE}/e3sm/source/components/homme
      - name: hommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 VERBOSE=ON
      - name: hommexx-test
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          ctest --output-on-failure -L unit
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-hommexx
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/Testing/Temporary/Last*
            e3sm/build/**/flags.make
          retention-days: 14

  # Forward sensitivities and FAD types (needs Trilinos/Sacado) and the AMDIS tests
  fad:
    runs-on: [ubuntu-24.04]
    name: fad
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: Build Trilinos
        uses: ./e3sm/source/.github/actions/build-trilinos
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
        with:
          scorpio: true
      - name: hommexx-configure
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm
          export Trilinos_ROOT=${GITHUB_WORKSPACE}/trilinos/install
          mkdir build && cd build
          cmake \
           -D CMAKE_CXX_COMPILER:STRING=mpicxx        \
           -D CMAKE_C_COMPILER:STIRNG=mpicc           \
           -D CMAKE_Fortran_COMPILER:STRING=mpifort   \
           -D CMAKE_BUILD_TYPE:STRING=RELEASE         \
           \
           -D NetCDF_C_PATH:PATH=${NETCDF_C_ROOT}                      \
           -D NetCDF_Fortran_PATH:PATH=${NETCDF_FORTRAN_ROOT}          \
           -D BLAS_LIBRARIES:FILEPATH=${BLAS_ROOT}/lib/libopenblas.a   \
           -D LAPACK_LIBRARIES:FILEPATH=${BLAS_ROOT}/lib/libopenblas.a \
           -D PIO_ENABLE_IO_STATS:BOOL=OFF                             \
           \
           -D HOMME_FIND_BLASLAPACK:BOOL=ON           \
           -D HOMME_AMDIS_PROJECT:BOOL=ON             \
           -D HOMMEXX_ENABLE_FWD_SENS:BOOL=ON         \
           -D HOMMEXX_ENABLE_FAD_TYPES:BOOL=ON        \
           -D HOMMEXX_BFB_TESTING:BOOL=ON             \
           \
           -S ${GITHUB_WORKSPACE}/e3sm/source/components/homme
      - name: hommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 VERBOSE=ON
      - name: hommexx-test
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          ctest --output-on-failure -L 'AMDIS|unit'
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-fad
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/Testing/Temporary/Last*
            e3sm/build/**/flags.make
          retention-days: 14

  # Python bindings (so far, we only check that they build)
  pyhommexx:
    runs-on: [ubuntu-24.04]
    name: pyhommexx
    container:
      image: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      options: --user root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: e3sm/source
      - name: Show action trigger
        uses: ./e3sm/source/.github/actions/show-workflow-trigger
      - name: Build Trilinos
        uses: ./e3sm/source/.github/actions/build-trilinos
      - name: get submodules
        uses: ./e3sm/source/.github/actions/homme-submodules
        with:
          scorpio: true
      - name: install python packages
        run: |
          # Installs into the image's venv; no-op for packages already there
          python3 -m pip install numpy xarray netCDF4 mpi4py nanobind
      - name: hommexx-configure
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm
          export Trilinos_ROOT=${GITHUB_WORKSPACE}/trilinos/install
          mkdir build && cd build
          cmake \
           -D CMAKE_BUILD_TYPE:STRING=RELEASE         \
           -D CMAKE_CXX_COMPILER:STRING=mpicxx        \
           -D CMAKE_C_COMPILER:STIRNG=mpicc           \
           -D CMAKE_Fortran_COMPILER:STRING=mpifort   \
           -D CMAKE_C_FLAGS:STRING="-fPIC"            \
           -D CMAKE_CXX_FLAGS:STRING="-fPIC"          \
           -D CMAKE_Fortran_FLAGS:STRING="-fPIC"      \
           \
           -D OPT_FLAGS:STRING="-O3"                  \
           \
           -D NetCDF_C_PATH:PATH=${NETCDF_C_ROOT}                      \
           -D NetCDF_Fortran_PATH:PATH=${NETCDF_FORTRAN_ROOT}          \
           -D BLAS_LIBRARIES:FILEPATH=${BLAS_ROOT}/lib/libopenblas.a   \
           -D LAPACK_LIBRARIES:FILEPATH=${BLAS_ROOT}/lib/libopenblas.a \
           -D PIO_ENABLE_IO_STATS:BOOL=OFF                             \
           \
           -D HOMME_FIND_BLASLAPACK:BOOL=ON           \
           -D HOMME_AMDIS_PROJECT:BOOL=ON             \
           -D HOMMEXX_ENABLE_FWD_SENS:BOOL=ON         \
           -D HOMMEXX_ENABLE_FAD_TYPES:BOOL=ON        \
           -D HOMMEXX_BFB_TESTING:BOOL=ON             \
           -D HOMME_BUILD_PYHOMMEXX:BOOL=ON           \
           -D PYHOMMEXX_NLEV:STRING=128               \
           -D PYHOMMEXX_QSIZE:STRING=10               \
           \
           -S ${GITHUB_WORKSPACE}/e3sm/source/components/homme
      - name: pyhommexx-build
        run: |
          cd ${GITHUB_WORKSPACE}/e3sm/build
          make -j4 pyhommexx VERBOSE=ON
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-pyhommexx
          path: |
            e3sm/build/CMakeCache.txt
            e3sm/build/**/flags.make
          retention-days: 14
